#  Flare Referrals · lang/en.yml — chat messages (menu texts are in menus/)
#  One line or a list of lines   ·   "" or [] = off   ·   {prefix} = the prefix below
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Click     "<click:run_command:'/referrals menu'>Text</click>"   Hover "<hover:show_text:'Text'>Text</hover>"
#  Tip       always write texts between "quotes"

lang-version: 12

prefix: "<gradient:#ff5f6d:#ffc371><bold>FLARE</bold></gradient> &7» &7"

general:
  no-permission: "{prefix}&cYou don't have permission to do this."
  players-only: "{prefix}&cOnly players can use this."
  # Answer for sub-commands that are turned off: looks like a command that doesn't exist.
  unknown-command: "{prefix}&cUnknown command. &7Use &f/{label} help"

help:
  # Only the commands a player can really use are shown.
  header:
    - ""
    - " &e&lFLARE REFERRALS"
  lines:
    refer: " &e/{label} <player> &7- enter who invited you to the server"
    info: " &e/{label} info &7- your invites"
    menu: " &e/{label} menu &7- rewards menu"
    rewards: " &e/{label} rewards &7- inviter and welcome rewards"
    top: " &e/{label} top &7- top inviters"
    milestone: " &e/{label} milestone <n> &7- rewards of a milestone"
    claim: " &e/{label} claim &7- collect reached milestones"
  footer: ""
  admin:
    - " <click:run_command:'/{label} admin'><hover:show_text:'&7Click for details'>&e/{label} admin &7- edit invites of a player</hover></click>"
    - " &e/{label} settings &7- admin menu"
    - " &e/{label} layout &7- edit the menus"
    - " &e/{label} reload &7- reload files"
    - ""

referral:
  disabled: "{prefix}&cReferrals are currently disabled."
  already-referred: "{prefix}&cYou already entered &f{player} &cas the player who invited you. &7It can be done only once."
  not-found: "{prefix}&f{player} &chas never joined the server. &7Check the name of the player who invited you."
  self: "{prefix}&cYou can't enter your own name. &7Write the name of the player who invited you."
  circular: "{prefix}&cYou invited &f{player} &cto the server, so they can't be the one who invited you."
  need-playtime: "{prefix}&cPlay at least &f{required} minutes &cbefore entering who invited you &7(you have {played})."
  same-ip: "{prefix}&cYou and &f{player} &cplay from the same network, so they can't be the one who invited you."
  success: "{prefix}&f{player} &ais now saved as the player who invited you. Enjoy your welcome reward!"
  received: "{prefix}&f{player} &aentered you as the player who invited them! &7You now have &e{invites} &7invites."
  broadcast: "{prefix}&f{player} &7was invited by &e{inviter}&7! &7({invites} invites)"

milestone:
  ready: "{prefix}&7Milestone &e{name} &7reached! <click:run_command:'/referrals claim {amount}'><hover:show_text:'&7Click to collect'>&e&n[Collect]</hover></click>"
  remind: "{prefix}&7You have &e{amount} &7reward(s) to collect. <click:run_command:'/referrals claim'><hover:show_text:'&7Click to collect all'>&e&n[Collect]</hover></click>"
  nothing: "{prefix}&7Nothing to collect right now."

reward:
  pending: "{prefix}&aYou received &f{amount} &areward(s) earned while you were offline!"

# /referrals info
# The line "{milestones}" is replaced with one "milestone-line" per milestone.
# Placeholders: {player} {invites} {referrer} {next} {remaining}
info:
  lines:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>REFERRAL INFO</bold></gradient> &7- &f{player}"
    - ""
    - " &7▪ &7Invites: &e{invites}"
    - " &7▪ &7Invited by: &f{referrer}"
    - " &7▪ &7Next milestone: &f{next} &7(&7{remaining} left&7)"
    - ""
    - "{milestones}"
    - ""
  # Placeholders: {status} {name} {amount} {target} {invites} {remaining} {hover}
  milestone-line: "  <click:run_command:'/referrals milestone {amount}'><hover:show_text:'{hover}'>{status} &f{name} &7(&7{invites}&7/&7{target}&7)</hover></click>"
  # line above the milestones (clickable to open the menu when the menu is on)
  milestones-header: " &7Milestones &7(click)"
  milestones-header-plain: " &7Milestones:"
  milestones-header-hover: "&7Open the menu"
  hover: "&7Click to see the rewards"
  hover-claim: "&eClick to collect"
  hover-admin: "&7Click to &eedit &7this milestone"
  status:
    claimed: "&a✔"
    ready: "&e★"
    locked: "&c✖"
    repeat: "&e⟳"
    disabled: "&7⏸"
  nobody: "&7nobody"
  no-next: "&7none"
  no-milestones: "  &7No milestones configured."

top:
  header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>TOP INVITERS</bold></gradient>"
    - ""
  line: " &e#{position} &f{player} &7- &7{invites} invites"
  empty: " &7Nobody has invited anyone yet."
  footer: ""

admin:
  reloaded: "{prefix}&aConfig, rewards and messages reloaded."
  milestone-created: "{prefix}&aMilestone &f{amount} invites &acreated."
  milestone-deleted: "{prefix}&cMilestone &f{amount} invites &cdeleted."
  milestone-exists: "{prefix}&cA milestone for &f{amount} &cinvites already exists."
  milestone-unknown: "{prefix}&cThere is no milestone for &f{amount} &cinvites."
  hold-item: "{prefix}&cHold an item in your main hand first."
  items-saved: "{prefix}&aSaved &f{amount} &aitem(s)."
  invites-updated: "{prefix}&f{player}&a: &7{before} &7→ &e{invites} &ainvites."
  reset: "{prefix}&aReferral data of &f{player} &areset."
  reset-claimed: "{prefix}&aClaimed milestones of &f{player} &areset."
  list-full: "{prefix}&cThis list is full (max {max} lines)."
  head-added: "{prefix}&aHead added."
  head-invalid: "{prefix}&f{input} &cis not a valid player name or head texture."
  display-empty: "{prefix}&7Nothing to show yet: set a title, action bar or boss bar first."
  layout-editing:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>EDITING MENU</bold></gradient> &7» &f{menu}"
    - " &7• &7Drag buttons and glass to move them"
    - " &7• &7Put any item from your inventory (glass, heads...) as decoration"
    - " &7• &7Take an item out to remove it"
    - " &7• &eShift + right-click &7an empty slot to add a button or glass"
    - " &7• &eShift + right-click &7an item to make it &cadmin only &7(players won't see it)"
    - " &7• &7Close the menu to &asave"
    - ""
  layout-saved: "{prefix}&aLayout of &f{menu} &asaved."
  menu-enabled: "{prefix}&aMenu &f{menu} &aturned on."
  menu-disabled: "{prefix}&cMenu &f{menu} &cturned off&7: its commands and the buttons to it are gone."
  layout-admin-only-on: "{prefix}&cAdmin only&7: normal players won't see this item."
  layout-admin-only-off: "{prefix}&aVisible to everyone&7 again."
  layout-reset: "{prefix}&aLayout of &f{menu} &arestored to default (old one in menus/{menu}.yml.bak)."
  layout-unknown: "{prefix}&cUnknown menu &f{menu}&c. Menus: main, rewards, top, preview"

# Shown when a command is written incomplete or wrong. Lines are clickable: they fill the chat bar.
usage:
  milestone: "{prefix}&7Use &e/{label} milestone <amount>"
  admin:
    unknown: "{prefix}&7Unknown action &e{action}"
    missing-player: "{prefix}&7Missing the &eplayer"
    missing-amount: "{prefix}&7Missing the &eamount"
    overview:
      - ""
      - " <click:suggest_command:'/{label} admin set <player> <n> '><hover:show_text:'&7Click to write it'>&e/{label} admin set <player> <n></hover></click> &7- set invites (no rewards)"
      - " <click:suggest_command:'/{label} admin add <player> <n> '><hover:show_text:'&7Click to write it'>&e/{label} admin add <player> <n></hover></click> &7- add invites (gives rewards)"
      - " <click:suggest_command:'/{label} admin remove <player> <n> '><hover:show_text:'&7Click to write it'>&e/{label} admin remove <player> <n></hover></click> &7- remove invites"
      - " <click:suggest_command:'/{label} admin reset <player> '><hover:show_text:'&7Click to write it'>&e/{label} admin reset <player></hover></click> &7- reset the player"
      - " <click:suggest_command:'/{label} admin resetclaimed <player> '><hover:show_text:'&7Click to write it'>&e/{label} admin resetclaimed <player></hover></click> &7- forget received milestones"
      - ""
    set:
      - "{prefix}&e/{label} admin set <player> <n>"
      - "&7Sets the exact invites, no rewards. Ex: &e/{label} admin set Steve 10"
    add:
      - "{prefix}&e/{label} admin add <player> <n>"
      - "&7Adds invites and gives the milestones reached. Ex: &e/{label} admin add Steve 3"
    remove:
      - "{prefix}&e/{label} admin remove <player> <n>"
      - "&7Removes invites, rewards already given stay. Ex: &e/{label} admin remove Steve 2"
    reset:
      - "{prefix}&e/{label} admin reset <player>"
      - "&7Invites to 0, milestones and inviter forgotten. Ex: &e/{label} admin reset Steve"
    resetclaimed:
      - "{prefix}&e/{label} admin resetclaimed <player>"
      - "&7Milestones can be received again at the next invite. Ex: &e/{label} admin resetclaimed Steve"

# Chat prompts used by the menus. {cancel} = cancel word, {seconds} = time limit
input:
  header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>FLARE</bold></gradient> &7» &fType in chat"
  suggestion: " &7» <hover:show_text:'&7Puts the current text in your chat bar'>&e&n[Click to edit the current text]</hover>"
  cancel-hint:
    - " &7» <click:run_command:'/referrals cancel'><hover:show_text:'&7Cancel and go back to the menu'>&c&n[Cancel]</hover></click> &7or type &7{cancel} &7· {seconds}s"
    - ""
  expired: "{prefix}&cTime is up, input cancelled."
  cancelled: "{prefix}&7Input cancelled."
  nothing-to-cancel: "{prefix}&7There is nothing to cancel."
  not-a-number: "{prefix}&f{input} &cis not a valid number."
  playtime: " &7Minimum playtime in &fminutes &7(0 = off):"
  milestone-new: " &7How many &finvites &7for the new milestone? &7(e.g. 3, 5, 10)"
  milestone-amount: " &7New &famount of invites &7for this milestone:"
  milestone-name: " &7New &fname &7(colors, hex and gradients allowed):"
  currency-amount: " &7Amount of {currency} &7(0 = remove):"
  line-add: " &7Write the new line:"
  line-edit: " &7Write the new text for &fline {line}&7:"
  head:
    - " &7Write a &fplayer name&7, or paste the &fValue&7 / texture"
    - " &7from &fminecraft-heads.com &7(the whole /give command works too)"
  display-title: " &7New &ftitle &7(big text in the middle of the screen):"
  layout-title: " &7New &fmenu title &7(type &fdefault &7for the original):"
  display-subtitle: " &7New &fsubtitle &7(small text under the title):"
  display-times: " &7Seconds for &ffade-in stay fade-out&7, separated by spaces &7(e.g. 0.5 3 1)"
  display-actionbar: " &7New &faction bar &7text (above the hotbar):"
  display-bossbar: " &7New &fboss bar &7text (top of the screen):"
