#  Flare Referrals · lang/en.yml — chat messages (menu texts are in menus/)
#  One line or a list of lines   ·   "" or [] = off   ·   {prefix} = the prefix below
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Click     "<click:run_command:'/referrals menu'>Text</click>"   Hover "<hover:show_text:'Text'>Text</hover>"
#  Tip       always write texts between "quotes"

lang-version: 12

prefix: "<gradient:#ff5f6d:#ffc371><bold>FLARE</bold></gradient> &7» &7"

general:
  no-permission: "{prefix}&cYou don't have permission to do this."
  players-only: "{prefix}&cOnly players can use this."
  # Answer for sub-commands that are turned off: looks like a command that doesn't exist.
  unknown-command: "{prefix}&cUnknown command. &7Use &f/{label} help"
  database-error: "{prefix}&cThe referral data can't be saved right now. &7Try again in a moment."

help:
  # Only the commands a player can really use are shown. {label} = the command typed, {version} = plugin version
  header:
    - " <gradient:#ff5f6d:#ffc371><bold>FLARE REFERRALS</bold></gradient> &7v{version}"
    - ""
  lines:
    refer: " &#ff7a6b/{label} <player> &7- enter who invited you"
    info: " &#ff7a6b/{label} info &7- your invites"
    menu: " &#ff7a6b/{label} menu &7- rewards menu"
    collect: " &#ff7a6b/{label} collect &7- rewards to collect"
    rewards: " &#ff7a6b/{label} rewards &7- inviter and welcome rewards"
    top: " &#ff7a6b/{label} top &7- top inviters"
    invited: " &#ff7a6b/{label} invited &7- the players you invited"
    event: " &#ff7a6b/{label} event &7- the reward event running now"
    milestone: " &#ff7a6b/{label} milestone <n> &7- rewards of a milestone"
    version: " &#ff7a6b/{label} about &7- version, updates and permissions"
  footer: ""
  # admins only (permission flarereferrals.admin)
  admin:
    - " <click:suggest_command:'/{label} admin set '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin set <player> <n></hover></click> &7- set invites"
    - " <click:suggest_command:'/{label} admin add '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin add <player> <n></hover></click> &7- add invites"
    - " <click:suggest_command:'/{label} admin remove '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin remove <player> <n></hover></click> &7- remove invites"
    - " <click:suggest_command:'/{label} admin reset '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin reset <player></hover></click> &7- reset a player"
    - " <click:suggest_command:'/{label} admin resetclaimed '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin resetclaimed <player></hover></click> &7- forget received milestones"
    - " &#ff7a6b/{label} settings &7- admin menu"
    - " &#ff7a6b/{label} layout &7- edit the menus"
    - " &#ff7a6b/{label} layout add <name> &7- new menu from a chest"
    - " <click:suggest_command:'/{label} event start '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} event start <x> <time></hover></click> &7- reward event (events.enabled)"
    - " &#ff7a6b/{label} reload &7- reload the files"
    - " <click:suggest_command:'/{label} migrate '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} migrate <yaml|sqlite|mysql></hover></click> &7- move the data"

referral:
  disabled: "{prefix}&cReferrals are currently disabled."
  already-referred: "{prefix}&cYou already entered &f{player} &cas the player who invited you. &7It can be done only once."
  not-found: "{prefix}&f{player} &chas never joined the server. &7Check the name of the player who invited you."
  self: "{prefix}&cYou can't enter your own name. &7Write the name of the player who invited you."
  circular: "{prefix}&cYou invited &f{player} &cto the server, so they can't be the one who invited you."
  need-playtime: "{prefix}&cPlay at least &f{required} minutes &cbefore entering who invited you &7(you have {played})."
  same-ip: "{prefix}&cYou and &f{player} &cplay from the same network, so they can't be the one who invited you."
  too-late: "{prefix}&cWho invited you can be entered only in your first &f{days} days &con the server."
  pending: "{prefix}&f{player} &ais saved as the player who invited you. &7Play &f{minutes} more minutes &7and the invite counts: then you get your welcome reward."
  verified: "{prefix}&aYour invite from &f{player} &anow counts. Enjoy your welcome reward!"
  success: "{prefix}&f{player} &ais now saved as the player who invited you. Enjoy your welcome reward!"
  received: "{prefix}&f{player} &aentered you as the player who invited them! &7You now have &#ff7a6b{invites} &7invites."
  broadcast: "{prefix}&f{player} &7was invited by &#ff7a6b{inviter}&7! &7({invites} invites)"

milestone:
  ready: "{prefix}&7Milestone &#ff7a6b{name} &7reached! <click:run_command:'/referrals claim {amount}'><hover:show_text:'&7Click to collect'>&#ff7a6b&n[Collect]</hover></click>"
  remind: "{prefix}&7You have &#ff7a6b{amount} &7reward(s) to collect. <click:run_command:'/referrals claim'><hover:show_text:'&7Click to collect all'>&#ff7a6b&n[Collect]</hover></click>"
  nothing: "{prefix}&7Nothing to collect right now."
  other-server: "{prefix}&7This reward can be collected on &f{servers}&7."
  any-other-server: "another server"
  # the reward can be collected only on this server, but this server has network.rewards-here: false
  no-server: "no server"

reward:
  pending: "{prefix}&aYou received &f{amount} &areward(s) earned while you were offline!"

# Rewards waiting in /referrals collect. {reward} = name of the reward, {amount} = how many wait
collect:
  new: "{prefix}&7New reward to collect: &f{reward} <click:run_command:'/referrals collect'><hover:show_text:'&7Open the menu'>&a&n[Collect]</hover></click>"
  remind: "{prefix}&7You have &#ff7a6b{amount} &7reward(s) to collect. <click:run_command:'/referrals collect'><hover:show_text:'&7Open the menu'>&a&n[Collect]</hover></click>"
  # same, for players who can't open the menu (they collect with /referrals claim)
  new-claim: "{prefix}&7New reward: &f{reward} <click:run_command:'/referrals claim'><hover:show_text:'&7Collect now'>&a&n[Collect]</hover></click>"
  remind-claim: "{prefix}&7You have &#ff7a6b{amount} &7reward(s) to collect. <click:run_command:'/referrals claim'><hover:show_text:'&7Collect now'>&a&n[Collect]</hover></click>"
  # the reward can be collected only on another server of the network
  new-other: "{prefix}&7New reward: &f{reward}&7, collect it on &f{servers}&7."
  several: "{amount} rewards"
  title: "&aNew reward!"
  subtitle: "&7{reward} &7- /referrals collect"
  actionbar: "&a+ {reward} &7» /referrals collect"
  nothing: "{prefix}&7Nothing to collect right now."
  inventory-full: "{prefix}&cMake room in your inventory to collect &f{reward}&c. &7It stays in the menu."
  inventory-full-some: "{prefix}&#ff7a6bSome rewards didn't fit in your inventory: &7they stay in the menu."
  other-server: "{prefix}&7This reward can be collected on &f{servers}&7."

# /referrals info
# The line "{milestones}" is replaced with one "milestone-line" per milestone.
# Placeholders: {player} {invites} {referrer} {next} {remaining}
info:
  lines:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>REFERRAL INFO</bold></gradient> &7- &f{player}"
    - ""
    - " &7▪ &7Invites: &#ff7a6b{invites}"
    - " &7▪ &7Invited by: &f{referrer}"
    - " &7▪ &7Next milestone: &f{next} &7(&7{remaining} left&7)"
    - ""
    - "{milestones}"
    - ""
  # Placeholders: {status} {name} {amount} {target} {invites} {remaining} {hover}
  milestone-line: "  <click:run_command:'/referrals milestone {amount}'><hover:show_text:'{hover}'>{status} &f{name} &7(&7{invites}&7/&7{target}&7)</hover></click>"
  # line above the milestones (clickable to open the menu when the menu is on)
  milestones-header: " &7Milestones &7(click)"
  milestones-header-plain: " &7Milestones:"
  milestones-header-hover: "&7Open the menu"
  hover: "&7Click to see the rewards"
  hover-claim: "&#ff7a6bClick to collect"
  hover-admin: "&7Click to &#ff7a6bedit &7this milestone"
  status:
    claimed: "&a✔"
    ready: "&#ff7a6b★"
    locked: "&c✖"
    repeat: "&#ff7a6b⟳"
    disabled: "&7⏸"
  nobody: "&7nobody"
  no-next: "&7none"
  no-milestones: "  &7No milestones configured."

top:
  header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>TOP INVITERS</bold></gradient>"
    - ""
  # PlaceholderAPI placeholders are of the player of the line: " &#ff7a6b#{position} %luckperms_prefix%&f{player} ..."
  line: " &#ff7a6b#{position} &f{player} &7- &7{invites} invites"
  empty: " &7Nobody has invited anyone yet."
  footer: ""

admin:
  reloaded: "{prefix}&aConfig, rewards and messages reloaded."
  # a file with a mistake is never overwritten. {file} {line} {column} {problem}
  file-error: "{prefix}&c{file} &7has a mistake around line &f{line}&7: &f{problem}&7. It was not changed: fix it and reload (until then the last working values are used)."
  milestone-created: "{prefix}&aMilestone &f{amount} invites &acreated."
  milestone-deleted: "{prefix}&cMilestone &f{amount} invites &cdeleted."
  milestone-exists: "{prefix}&cA milestone for &f{amount} &cinvites already exists."
  milestone-unknown: "{prefix}&cThere is no milestone for &f{amount} &cinvites."
  hold-item: "{prefix}&cHold an item in your main hand first."
  items-saved: "{prefix}&aSaved &f{amount} &aitem(s)."
  invites-updated: "{prefix}&f{player}&a: &7{before} &7→ &#ff7a6b{invites} &ainvites."
  reset: "{prefix}&aReferral data of &f{player} &areset."
  reset-claimed: "{prefix}&aClaimed milestones of &f{player} &areset."
  player-not-found: "{prefix}&f{player} &chas never joined the server."
  restart-needed: "{prefix}&#ff7a6bStorage / network settings changed: &frestart the server &#ff7a6bto use them."
  migrate:
    started: "{prefix}&7Copying the data to &f{type}&7..."
    same: "{prefix}&7This server already uses &f{type}&7."
    running: "{prefix}&7A copy is already running, wait for it to finish."
    not-empty: "{prefix}&c{type} already has &f{amount} &cplayers. &7To join them with the data of this server use &#ff7a6b{command}"
    summary:
      - "{prefix}&7Copy &f{players} &7players and &f{rewards} &7rewards to &f{type}&7."
      - "&7The current data stays as a backup. Then restart the server."
      - "<click:suggest_command:'{command}'><hover:show_text:'&7Click to write it'>&#ff7a6bType {command} &7to start</hover></click>"
    summary-merge:
      - "{prefix}&7Join &f{players} &7players of this server with the &f{amount} &7already in &f{type}&7."
      - "&7Same player on both: invites added up, the first inviter entered is kept, rewards kept."
      - "&cStop the other servers that use this database first, then start them again after the restart."
      - "<click:suggest_command:'{command}'><hover:show_text:'&7Click to write it'>&#ff7a6bType {command} &7to start</hover></click>"
    done: "{prefix}&aCopied &f{players} &aplayers and &f{rewards} &arewards to &f{type}&a."
    merged: "{prefix}&aJoined: &f{added} &anew players, &f{joined} &aon both ({conflicts} with two inviters). &f{players} &aplayers in &f{type}&a."
    failed: "{prefix}&cCopy to &f{type} &cfailed: &7{error}"
    restart: "{prefix}&#ff7a6bRestart the server now. &7Until then referrals and rewards are paused, so nothing is lost."
  list-full: "{prefix}&cThis list is full (max {max} lines)."
  head-added: "{prefix}&aHead added."
  head-invalid: "{prefix}&f{input} &cis not a valid player name or head texture."
  display-empty: "{prefix}&7Nothing to show yet: set a title, action bar or boss bar first."
  layout-editing:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>EDITING MENU</bold></gradient> &7» &f{menu}"
    - " &7• &7Drag buttons and glass to move them"
    - " &7• &7Put any item from your inventory (glass, heads...) as decoration"
    - " &7• &7Take an item out to remove it"
    - " &7• &#ff7a6bShift + right-click &7an empty slot to add a button or glass"
    - " &7• &#ff7a6bShift + right-click &7an item to make it &cadmin only &7(players won't see it)"
    - " &7• &7Close the menu to &asave"
    - ""
  layout-saved: "{prefix}&aLayout of &f{menu} &asaved."
  # the menu was changed while the editor was open (import, reset, reload): the new layout stays
  layout-changed: "{prefix}&cLayout of &f{menu} &cnot saved: the menu was changed meanwhile (import, reset or reload). Your items are back in your inventory."
  layout-not-saved: "{prefix}&cLayout of &f{menu} &cnot saved: menus/{menu}.yml has a mistake (see the console). Fix it and use /referrals reload."
  menu-enabled: "{prefix}&aMenu &f{menu} &aturned on."
  menu-disabled: "{prefix}&cMenu &f{menu} &cturned off&7: its commands and the buttons to it are gone."
  layout-admin-only-on: "{prefix}&cAdmin only&7: normal players won't see this item."
  layout-admin-only-off: "{prefix}&aVisible to everyone&7 again."
  layout-reset: "{prefix}&aLayout of &f{menu} &arestored to default (old one in menus/{menu}.yml.bak)."
  layout-unknown: "{prefix}&cUnknown menu &f{menu}&c. Menus: main, rewards, top, preview"

# Shown when a command is written incomplete or wrong. Lines are clickable: they fill the chat bar.
usage:
  milestone: "{prefix}&7Use &#ff7a6b/{label} milestone <amount>"
  by: "{prefix}&7Use &#ff7a6b/{label} by <player> &7with the name of the player who invited you"
  migrate:
    - "{prefix}&#ff7a6b/{label} migrate <yaml|sqlite|mysql> [merge]"
    - "&7Copies all the data to another storage (set &fstorage.mysql &7in config.yml first)."
    - "&7merge = join with the data already there (two servers going on one database)."
  admin:
    unknown: "{prefix}&7Unknown action &#ff7a6b{action}"
    missing-player: "{prefix}&7Missing the &#ff7a6bplayer"
    missing-amount: "{prefix}&7Missing the &#ff7a6bamount"
    overview:
      - " <gradient:#ff5f6d:#ffc371><bold>FLARE REFERRALS</bold></gradient> &7admin"
      - ""
      - " <click:suggest_command:'/{label} admin set '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin set <player> <n></hover></click> &7- set invites (no rewards)"
      - " <click:suggest_command:'/{label} admin add '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin add <player> <n></hover></click> &7- add invites (gives rewards)"
      - " <click:suggest_command:'/{label} admin remove '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin remove <player> <n></hover></click> &7- remove invites"
      - " <click:suggest_command:'/{label} admin reset '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin reset <player></hover></click> &7- reset a player"
      - " <click:suggest_command:'/{label} admin resetclaimed '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} admin resetclaimed <player></hover></click> &7- forget received milestones"
    set:
      - "{prefix}&#ff7a6b/{label} admin set <player> <n>"
      - "&7Sets the exact invites, no rewards. Ex: &#ff7a6b/{label} admin set Steve 10"
    add:
      - "{prefix}&#ff7a6b/{label} admin add <player> <n>"
      - "&7Adds invites and gives the milestones reached. Ex: &#ff7a6b/{label} admin add Steve 3"
    remove:
      - "{prefix}&#ff7a6b/{label} admin remove <player> <n>"
      - "&7Removes invites, rewards already given stay. Ex: &#ff7a6b/{label} admin remove Steve 2"
    reset:
      - "{prefix}&#ff7a6b/{label} admin reset <player>"
      - "&7Invites to 0, milestones and inviter forgotten. Ex: &#ff7a6b/{label} admin reset Steve"
    resetclaimed:
      - "{prefix}&#ff7a6b/{label} admin resetclaimed <player>"
      - "&7Milestones can be received again at the next invite. Ex: &#ff7a6b/{label} admin resetclaimed Steve"

# Chat prompts used by the menus. {cancel} = cancel word, {seconds} = time limit
input:
  who-invited:
    - " &7Write the &fname &7of the player who invited you to the server:"
  header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>FLARE</bold></gradient> &7» &fType in chat"
  suggestion: " &7» <hover:show_text:'&7Puts the current text in your chat bar'>&#ff7a6b&n[Click to edit the current text]</hover>"
  cancel-hint:
    - " &7» <click:run_command:'/referrals cancel'><hover:show_text:'&7Cancel and go back to the menu'>&c&n[Cancel]</hover></click> &7or type &7{cancel} &7· {seconds}s"
    - ""
  expired: "{prefix}&cTime is up, input cancelled."
  cancelled: "{prefix}&7Input cancelled."
  nothing-to-cancel: "{prefix}&7There is nothing to cancel."
  not-a-number: "{prefix}&f{input} &cis not a valid number."
  playtime: " &7Minimum playtime in &fminutes &7(0 = off):"
  max-days: " &7Days after the first join to enter the inviter &7(0 = no limit):"
  verify-minutes: " &7Minutes the new player must play before the invite counts &7(0 = right away):"
  servers: " &7Servers where this reward can be received, separated by commas &7(all = every server):"
  milestone-new: " &7How many &finvites &7for the new milestone? &7(e.g. 3, 5, 10)"
  milestone-amount: " &7New &famount of invites &7for this milestone:"
  milestone-name: " &7New &fname &7(colors, hex and gradients allowed):"
  currency-amount: " &7Amount of {currency} &7(0 = remove):"
  line-add: " &7Write the new line:"
  line-edit: " &7Write the new text for &fline {line}&7:"
  head:
    - " &7Write a &fplayer name&7, or paste the &fValue&7 / texture"
    - " &7from &fminecraft-heads.com &7(the whole /give command works too)"
  display-title: " &7New &ftitle &7(big text in the middle of the screen):"
  layout-title: " &7New &fmenu title &7(type &fdefault &7for the original):"
  display-subtitle: " &7New &fsubtitle &7(small text under the title):"
  display-times: " &7Seconds for &ffade-in stay fade-out&7, separated by spaces &7(e.g. 0.5 3 1)"
  display-actionbar: " &7New &faction bar &7text (above the hotbar):"
  display-bossbar: " &7New &fboss bar &7text (top of the screen):"

# /referrals about (also version / ver). {version} {latest} {url} {label}
about:
  header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>FLARE REFERRALS</bold></gradient>"
  checking: " &7Checking for updates..."
  # first line, depends on the update check
  latest: " &7Plugin version: &a{version} &8- &alatest version!"
  outdated: " &7Plugin version: &c{version} &8- &c&lOUTDATED! &7Please update to &#ff7a6b{latest} <click:open_url:'{url}'><hover:show_text:'&7Click to open the download page'>&#ff7a6b&n[Download]</hover></click>"
  failed: " &7Plugin version: &f{version} &8- &7could not check for updates right now"
  check-off: " &7Plugin version: &f{version} &8- &7update check is off"
  # {minecraft} {server} {java} {storage} {network} {notifier} {hooks}
  info:
    - " &7Server version: &f{minecraft} &8({server})"
    - " &7Java: &f{java} &8| &7Storage: &f{storage}{network}"
    - " &7Update notifier: {notifier}"
    - " &7Plugin hooks: {hooks}"
    - " &7Permissions: <click:run_command:'/{label} about permissions'><hover:show_text:'&7Click to see every permission'>&#ff7a6b&n[Show list]</hover></click>"
  # added to {network} when network mode is on. {server-name} = network.server-name of this server
  network: " &8| &7Network: &f{server-name}"
  notifier-on: "&atrue"
  notifier-off: "&cfalse"
  # {hook} = name of the plugin; hooked = installed and in use, missing = not installed
  hooked: "&a{hook}"
  missing: "&8{hook}"
  separator: "&7, "
  permissions:
    header:
      - ""
      - " <gradient:#ff5f6d:#ffc371><bold>FLARE REFERRALS</bold></gradient> &7permissions"
    line: " <click:copy_to_clipboard:'{permission}'><hover:show_text:'&7Click to copy'>&#ff7a6b{permission}</hover></click> &8- &7{description} &8({default})"
    # who has it without a permissions plugin
    everyone: "everyone"
    op: "op"
    not-op: "not op"
    nobody: "nobody"

# Chest builder: /referrals layout add | import | chest | remove | list   (admins)
builder:
  usage:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>CHEST BUILDER</bold></gradient> &7- build a menu in a chest, look at it and type:"
    - " &#ff7a6b/{label} layout add <name> &7- new menu, opened with /<name>"
    - " &#ff7a6b/{label} layout import <menu> &7- the chest replaces the items of a menu"
    - " &#ff7a6b/{label} layout chest <menu> &7- puts a menu in the empty chest"
    - " &#ff7a6b/{label} layout remove <name> &7- deletes a menu made with add"
    - " &#ff7a6b/{label} layout list &7- every menu"
    - " &7Actions in the lore: &f[close] [open] <menu> [player] <cmd> [console] <cmd> [message] <text>..."
    - " &7Options: &f[left] [right] [permission] <node> [admin-only] [update] [button] <id>"
  no-container: "{prefix}&cLook at a chest, double chest, barrel or shulker box (at most 5 blocks away)."
  unsupported: "{prefix}&cA &f{block} &ccan't be used: use a chest, double chest, trapped chest, barrel or shulker box."
  empty: "{prefix}&cThe chest is empty: put the items of the menu in it first."
  not-empty: "{prefix}&cThe chest must be empty: the menu &f{menu} &cis put in it."
  too-small: "{prefix}&cThe menu &f{menu} &chas &f{rows} &crows: use a double chest."
  bad-name: "{prefix}&cMenu names use only a-z, 0-9 and -, at most 32 characters (not add, import, chest, remove, list)."
  reserved: "{prefix}&f{name} &cis used by the plugin: pick another name (menus of the plugin change with &f/{label} layout import <menu>&c)."
  exists: "{prefix}&cThe menu &f{name} &calready exists: use &f/{label} layout import {name}&c, or remove it first."
  command-taken: "{prefix}&c/{name} is already a command of &f{plugin}&c: pick another name."
  unknown: "{prefix}&cThere is no menu called &f{menu}&c. Menus: &f{menus}"
  not-custom: "{prefix}&f{menu} &cis a menu of the plugin and can't be deleted. Reset it in &f/{label} settings &c> Menu layouts."
  created: "{prefix}&aMenu &f{menu} &acreated: players open it with &f/{menu}&a."
  imported: "{prefix}&aMenu &f{menu} &aupdated from the chest."
  # {rows} {items} {actions} {buttons} {file}
  summary:
    - " &7{rows} rows &8· &7{items} items &8· &7{actions} actions &8· &7{buttons} buttons"
    - " &7Saved in &f{file}"
  backup: " &7Old file saved in &fbackups/{file}"
  warn-unknown-button: " &#ffc371⚠ &7[button] &f{button} &7doesn't exist in this menu (slot {slot}). Buttons: &f{buttons}"
  warn-unknown-action: " &#ffc371⚠ &7Unknown action &f{action} &7(slot {slot}): it does nothing."
  warn-covered: " &#ffc371⚠ &7{amount} items are under plugin buttons and are not shown (slots {slots})."
  warn-outside: " &#ffc371⚠ &7The buttons &f{buttons} &7are outside the {rows} rows and are not shown."
  warn-removed: " &#ffc371⚠ &7Taken out of the chest, so removed from the menu: &f{buttons}"
  exported: "{prefix}&aMenu &f{menu} &aput in the chest &7({items} items)&a. Change it, then &f/{label} layout import {menu}&a."
  exported-rows: " &7The menu has {rows} rows, the chest {chest}: the import keeps {rows} rows."
  remove-confirm: "{prefix}&7Delete the menu &f{menu}&7? <click:run_command:'/{label} layout remove {menu} confirm'><hover:show_text:'&7Click to delete it'>&c&n[Delete]</hover></click> &8(a copy goes in backups/)"
  removed: "{prefix}&aMenu &f{menu} &adeleted. A copy is in &fbackups/{file}&a."
  remove-failed: "{prefix}&cCould not delete menus/{menu}.yml, see the console."
  list-header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>MENUS</bold></gradient> &7- click one to edit it"
  list-line: " <click:run_command:'/{label} layout {menu}'><hover:show_text:'&7Click to edit it'>&#ff7a6b{menu}</hover></click> &8- &7{rows} rows, {type}{state}"
  type-plugin: "menu of the plugin"
  type-custom: "chest builder &8({commands}&8)"
  disabled: " &c(off)"

# New version message for admins when they join (update-check in config.yml). {version} {latest} {url}
update:
  join: "{prefix}&7FlareReferrals &f{latest} &7is out &8(you have {version})&7. <click:open_url:'{url}'><hover:show_text:'&7Open the download page'>&#ff7a6b&n[Download]</hover></click>"

# /referrals invited: the players someone invited (player-access.invited in config.yml)
# {player} {amount} {verified} {pending} · line: {number} {player} {date} {status}
invited:
  header:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>INVITED BY {player}</bold></gradient> &7· {amount} &7({verified} counted, {pending} waiting)"
  line: " &7{number}. &f{player} &8· &7{date} &8· {status}"
  empty: " &7Nobody yet. New players who write &#ff7a6b/referrals {player} &7show up here."
  more: " &7... and &f{amount} &7more. &8(/referrals invited for the menu)"
  date-format: "dd/MM/yyyy"
  status:
    verified: "&a✔ counted"
    pending: "&#ff7a6b◷ waiting for playtime"

# Reminder to new players (invite-hint in config.yml). {player} {days} = days left to do it
# chat-days is used when referral.max-days-after-first-join is set
hint:
  chat:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>WHO INVITED YOU?</bold></gradient>"
    - " &7Did a friend invite you? Write <click:suggest_command:'/referrals '><hover:show_text:'&7Click to write it'>&#ff7a6b&n/referrals <name></hover></click>"
    - " &7and you both get a reward."
    - ""
  chat-days:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>WHO INVITED YOU?</bold></gradient>"
    - " &7Did a friend invite you? Write <click:suggest_command:'/referrals '><hover:show_text:'&7Click to write it'>&#ff7a6b&n/referrals <name></hover></click>"
    - " &7and you both get a reward. &8(you have {days} days)"
    - ""
  title: "&#ff7a6bWho invited you?"
  subtitle: "&7Write &f/referrals <name>"
  actionbar: "&7Invited by a friend? &#ff7a6b/referrals <name>"
  bossbar: "&7Invited by a friend? Write &#ff7a6b/referrals <name>"

# Reward events (/referrals event, events in config.yml)
# {multiplier} {time} = time left, {reason}, {by} = who started it, {player} = who reads it
event:
  started:
    - ""
    - " <gradient:#ff5f6d:#ffc371><bold>REFERRAL EVENT</bold></gradient>"
    - " &7Rewards for invites are &#ff7a6b&lx{multiplier} &7for &f{time}&7!"
    - " &7Tell your friends to join and write &#ff7a6b/referrals {player}"
    - ""
  reason: " &7{reason}"
  ended: "{prefix}&7The referral event &#ff7a6bx{multiplier} &7is over. Thanks for inviting!"
  title: "&#ff7a6b&lx{multiplier} REFERRAL REWARDS"
  subtitle: "&7for {time}"
  bossbar: "&#ff7a6b&lx{multiplier} &frewards for invites &7· {time} left"
  actionbar: "&#ff7a6bx{multiplier} &7rewards for invites &8· &f{time} &7left"
  join: "{prefix}&7Referral event: rewards &#ff7a6bx{multiplier} &7for &f{time}&7. <click:run_command:'/referrals event'><hover:show_text:'&7Details'>&#ff7a6b&n[Info]</hover></click>"
  remind: "{prefix}&7Referral event: rewards &#ff7a6bx{multiplier} &7for &f{time} &7more."
  status: "{prefix}&7Referral event: rewards &#ff7a6bx{multiplier} &7· &f{time} &7left"
  none: "{prefix}&7No referral event right now."
  bonus: "{prefix}&#ff7a6bEvent bonus: &fx{multiplier}"
  units:
    days: "d"
    hours: "h"
    minutes: "m"
    seconds: "s"
  admin:
    usage:
      - "{prefix}<click:suggest_command:'/{label} event start '><hover:show_text:'&7Click to write it'>&#ff7a6b/{label} event start <multiplier> <time> [reason]</hover></click>"
      - "&7Ex: &#ff7a6b/{label} event start 2 48h Weekend! &7· times: 30m, 2h, 1d, 1h30m"
      - "<click:run_command:'/{label} event stop'><hover:show_text:'&7Click to stop it'>&#ff7a6b/{label} event stop</hover></click> &7- ends it now"
    started: "{prefix}&aEvent started: &fx{multiplier} &afor &f{time}&a."
    stopped: "{prefix}&aEvent stopped."
    replaced: "{prefix}&7The event running (&fx{multiplier}&7, {time} left) is replaced by the new one."
    not-running: "{prefix}&7No event is running."
    disabled: "{prefix}&cEvents are off. &7Turn them on in &f/referrals settings &7or with &fevents.enabled: true &7in config.yml."
    bad-multiplier: "{prefix}&f{input} &cis not a valid multiplier. &7Use a number above 1 and up to {max}, e.g. 2 or 1.5."
    bad-time: "{prefix}&f{input} &cis not a valid time. &7Examples: 30m, 2h, 1d, 1h30m."
