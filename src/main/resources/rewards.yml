#  Flare Referrals · rewards.yml — what players get
#  In-game: /referrals settings > Referral rewards / Milestones
#
#  inviter      the player written in /referrals <player>
#  invited      the new player who uses /referrals <player>
#  milestones   extra rewards at X invites   ·   repeat: true = every X (3, 6, 9...)
#  active-friends  for the inviter when a player he invited reaches X minutes of playtime (config.yml active-friends)
#  period-top   for the best inviters of the week / month (config.yml period-top)
#
#  items        drag them in-game, or "DIAMOND:5"
#  currencies   <id from config.yml>: <amount>
#  commands     run by console, no /   ·   "lp user {player} parent add vip"
#  messages     to the player   ·   broadcast: to everyone
#  display      title, subtitle, actionbar, bossbar   ·   times in ticks (20 = 1s)
#  delivery     default (config.yml rewards.collect-menu) · menu = waits in /referrals collect · auto = given right away
#  servers      network only: where it can be received   ·   [all] or [skyblock, survival]
#  Placeholders {player} {invites} {milestone} {inviter} {invited} {prefix}
#               active-friends: {invited} {goal}   ·   period-top: {position} {period} {period-invites}
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Click     "<click:run_command:'/referrals menu'>Text</click>"   Hover "<hover:show_text:'Text'>Text</hover>"
#  Tip       always write texts between "quotes"

referral:
  # Owner of the referral code (the player written in /referrals <player>)
  inviter:
    enabled: true
    items:
      - "DIAMOND:2"
    currencies:
      money: 250
    commands: []
    messages:
      - "{prefix}&7You received your invite reward for &f{invited}&7!"
    broadcast: []
    display:
      title:
        title: ""
        subtitle: ""
        fade-in: 10
        stay: 60
        fade-out: 20
      actionbar: "&a+1 invite &7» &f{invited} &7joined thanks to you"
      bossbar:
        text: ""
        color: PINK
        style: PROGRESS
        seconds: 5
  # Player who used /referrals <player>
  invited:
    enabled: true
    items:
      - "IRON_INGOT:8"
    currencies:
      money: 100
    commands: []
    messages:
      - "{prefix}&7Thanks for joining through &f{inviter}&7! Here is your welcome reward."
    broadcast: []
    display:
      title:
        title: "<gradient:#ff5f6d:#ffc371><bold>WELCOME</bold></gradient>"
        subtitle: "&7Invited by &f{inviter}"
        fade-in: 10
        stay: 60
        fade-out: 20
      actionbar: ""
      bossbar:
        text: ""
        color: PINK
        style: PROGRESS
        seconds: 5

milestones:
  '3':
    enabled: true
    repeat: false
    name: "<gradient:#ffb347:#ffcc33>3 Invites</gradient>"
    icon: IRON_BLOCK
    items:
      - "GOLDEN_APPLE:3"
    currencies:
      money: 1000
      mobcoins: 25
    commands: []
    messages:
      - "{prefix}&aYou reached &f3 invites&a! Milestone reward received."
    broadcast: []
    display:
      title:
        title: "&#ff7a6b3 INVITES"
        subtitle: "&7Milestone reward received"
        fade-in: 10
        stay: 60
        fade-out: 20
      actionbar: ""
      bossbar:
        text: "<gradient:#ff5f6d:#ffc371>Milestone 3 invites reached!</gradient>"
        color: YELLOW
        style: PROGRESS
        seconds: 6
  '5':
    enabled: true
    repeat: false
    name: "<gradient:#ff5f6d:#ffc371>5 Invites</gradient>"
    icon: GOLD_BLOCK
    items:
      - "DIAMOND:8"
    currencies:
      money: 2500
      tokens: 50
    commands: []
    messages:
      - "{prefix}&aYou reached &f5 invites&a! Milestone reward received."
    broadcast:
      - "{prefix}&f{player} &7reached &#ff7a6b5 invites&7!"
    display:
      title:
        title: "&#ff7a6b5 INVITES"
        subtitle: "&7Milestone reward received"
        fade-in: 10
        stay: 60
        fade-out: 20
      actionbar: ""
      bossbar:
        text: "<gradient:#ff5f6d:#ffc371>Milestone 5 invites reached!</gradient>"
        color: YELLOW
        style: PROGRESS
        seconds: 6
  '10':
    enabled: true
    repeat: false
    name: "<gradient:#00c6ff:#0072ff>10 Invites</gradient>"
    icon: DIAMOND_BLOCK
    items:
      - "NETHERITE_INGOT:1"
    currencies:
      money: 7500
      mobcoins: 100
      coins: 50
    commands: []
    messages:
      - "{prefix}&aYou reached &f10 invites&a! Milestone reward received."
    broadcast:
      - "{prefix}&f{player} &7reached &b10 invites&7! Legend."
    display:
      title:
        title: "&#ff7a6b10 INVITES"
        subtitle: "&7Milestone reward received"
        fade-in: 10
        stay: 60
        fade-out: 20
      actionbar: ""
      bossbar:
        text: "<gradient:#ff5f6d:#ffc371>Milestone 10 invites reached!</gradient>"
        color: YELLOW
        style: PROGRESS
        seconds: 6

# Rewards for the inviter when a player he invited keeps playing. The key is the playtime of the invited player
# after the invite, in minutes (60 = 1 hour). Each goal is given once for every invited player. Turn it on in config.yml
# (active-friends.enabled: true). {invited} = the friend, {goal} = the playtime ("5h")
active-friends:
  '60':
    name: "&#ff7a6bFriend played 1 hour"
    currencies:
      money: 250
    messages:
      - "{prefix}&f{invited} &7played &f{goal}&7: &a+$250 &7for inviting him!"
  '300':
    name: "&#ff7a6bFriend played 5 hours"
    currencies:
      money: 1000
    messages:
      - "{prefix}&f{invited} &7played &f{goal}&7: &a+$1000 &7for inviting him!"
  '600':
    name: "<gradient:#ff5f6d:#ffc371>Friend played 10 hours</gradient>"
    items:
      - "DIAMOND:5"
    currencies:
      money: 2500
    messages:
      - "{prefix}&f{invited} &7played &f{goal}&7: &a+$2500 &7and &b5 diamonds&7!"

# Rewards for the best inviters of the week and of the month, given when it ends. Key = position (1 = first).
# Turn it on in config.yml (period-top). {position} {period} = "week" / "month", {period-invites} = his invites then
period-top:
  weekly:
    '1':
      name: "&#ff7a6b#1 of the week"
      currencies:
        money: 5000
      messages:
        - "{prefix}&aYou were &f#1 &aof the week with &f{period-invites} &ainvites!"
    '2':
      name: "&#ff7a6b#2 of the week"
      currencies:
        money: 2500
      messages:
        - "{prefix}&aYou were &f#2 &aof the week with &f{period-invites} &ainvites!"
    '3':
      name: "&#ff7a6b#3 of the week"
      currencies:
        money: 1000
      messages:
        - "{prefix}&aYou were &f#3 &aof the week with &f{period-invites} &ainvites!"
  monthly:
    '1':
      name: "<gradient:#ff5f6d:#ffc371>#1 of the month</gradient>"
      items:
        - "NETHERITE_INGOT:1"
      currencies:
        money: 20000
      messages:
        - "{prefix}&aYou were &f#1 &aof the month with &f{period-invites} &ainvites!"
    '2':
      name: "&#ff7a6b#2 of the month"
      currencies:
        money: 10000
      messages:
        - "{prefix}&aYou were &f#2 &aof the month with &f{period-invites} &ainvites!"
    '3':
      name: "&#ff7a6b#3 of the month"
      currencies:
        money: 5000
      messages:
        - "{prefix}&aYou were &f#3 &aof the month with &f{period-invites} &ainvites!"
