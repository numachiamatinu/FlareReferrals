#  Flare Referrals · config.yml · by TMDevelopment
#  In-game: /referrals settings   ·   after editing this file: /referrals reload
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Click     "<click:run_command:'/referrals menu'>Text</click>"   Hover "<hover:show_text:'Text'>Text</hover>"
#  Tip       always write texts between "quotes"

language: en

# Anonymous usage statistics (TMDStats): versions, player count and the options listed on the plugin page.
# No names, UUIDs or IPs. false = this plugin sends nothing (plugins/TMDStats/config.yml turns off all plugins)
stats: true

# logs/referrals.log: every invite (also the blocked ones, with the reason), reward given and admin change,
# with date and server. Useful for tickets and abuse. false = no log
logs:
  referrals: true

# Checks GitHub for a new version (at startup, then at most every 6 hours) and tells admins when they join.
# It only reads the public releases page, nothing about your server is sent. false = no check
update-check: true

# Missing plugins are downloaded and started automatically (no restart needed).
# Sources are tried in order: modrinth:<slug>, hangar:<slug>, github:<owner/repo>, url:<direct link>
# Note: Vault only connects the money; you still need an economy plugin (EssentialsX, CMI...).
auto-install:
  enabled: true
  plugins:
    PlaceholderAPI:
      enabled: true
      sources:
        - "hangar:PlaceholderAPI"
        - "modrinth:placeholderapi"
        - "github:PlaceholderAPI/PlaceholderAPI"
    Vault:
      enabled: true
      sources:
        - "github:MilkBowl/Vault"

# How it works: a new player writes /referrals <name> with the name of the player who really invited him.
# Both get a reward (rewards.yml), the inviter gets +1 invite. Each player can do it only once.
# Every option in this section can also be toggled from /referrals settings
referral:
  # Master switch for /referrals <player>
  enabled: true
  # A player can't enter an inviter who plays from the same IP (alts). IPs are stored as a hash, never in plain text
  block-same-ip: true
  # If B entered A as his inviter, A can't enter B back
  prevent-circular: true
  # Minutes a player must play before he can enter who invited him. 0 = disabled
  min-playtime-minutes: 0
  # Broadcast a message to the whole server on every referral
  broadcast: false
  # Title on the screen of the inviter when someone enters him (the chat message and the sound are always there).
  # Texts in lang/en.yml > referral.received-title / received-subtitle
  inviter-title: true
  # Days after the first join in which a player can still enter who invited him. 0 = no limit
  max-days-after-first-join: 0
  # The invite counts (and the rewards are given) only after the new player played these minutes. 0 = right away
  verify-after-minutes: 0

# What normal players (without flarereferrals.admin) can open. false = only admins.
# Also editable in /referrals settings > Player access. With a permissions plugin you can also deny
# flarereferrals.info / .menu / .rewards / .top / .preview to single groups.
player-access:
  # /referrals and /referrals info (invites, inviter, milestones list)
  info: true
  # /referrals menu (main menu with progress)
  menu: true
  # /referrals rewards (inviter reward and welcome reward)
  rewards: true
  # top inviters (/referrals top and the top menu)
  top: true
  # see what a milestone / reward gives (click on it)
  preview: true
  # /referrals collect (rewards waiting to be collected)
  collect: true
  # /referrals invited (the players you invited, with the date): off until you turn it on.
  # Add the "Your invited players" button to /referrals menu in its editor (Menu layouts > main)
  invited: false
  # /referrals code (needs codes.enabled)
  code: true
  # /referrals share
  share: true

invited:
  # Players listed by /referrals invited chat (the menu has pages)
  chat-lines: 20

top:
  # Players per page in /referrals top in chat (« » change page, or /referrals top 2)
  chat-lines: 10

# ── Personal codes ──────────────────────────────────────
# /referrals code gives every player a code like K7QM2X: friends can write /referrals K7QM2X instead of the name
# (handy for Bedrock names with a dot or players who change name). A real name always wins over a code.
# Placeholder %flarereferrals_code%
codes:
  enabled: true
  # Letters of a new code (5-8). Codes already made keep their length
  length: 6

# ── Share ───────────────────────────────────────────────
# /referrals share shows a ready message with [Copy] and [Post in chat]. {player} {code} {address}
share:
  # Your server address, e.g. play.myserver.net ("" = "the server")
  address: ""
  text: "Join {address} and write /referrals {code} to get a welcome reward!"
  # Used when codes are off
  text-no-code: "Join {address} and write /referrals {player} to get a welcome reward!"
  # Minutes between two [Post in chat] of the same player (admins: no wait). 0 = no limit
  chat-cooldown-minutes: 10

# ── Active friends ──────────────────────────────────────
# The inviter gets a reward when a player he invited reaches a playtime: 1 hour, 5 hours, 10 hours...
# It rewards friends who really play, not accounts made for the invite. Goals and rewards: rewards.yml > active-friends.
# Only the playtime after the invite counted (the whole network with network.enabled). Off by default.
active-friends:
  enabled: false
  # Goals count the playtime after the invite counted. Invites made before 1.1.0 don't know it:
  # false = they give no goals, true = they count all their playtime (turning it on may pay many goals at once)
  old-invites: false

# ── Rank multipliers ────────────────────────────────────
# Players with the permission flarereferrals.multiplier.<name> get their rewards multiplied (the highest one counts).
# Give it with your permission plugin, e.g. LuckPerms: /lp group vip permission set flarereferrals.multiplier.vip
# Operators don't get it unless the permission is really given to them. Works together with reward events (x2 * x1.5).
multipliers:
  enabled: false
  ranks:
    vip: 1.5
    mvp: 2
  # Items too, only by whole numbers (x2, x3): x1.5 gives the normal items
  items: false
  # Which rewards get it
  rewards:
    inviter: true
    welcome: false
    milestones: true
    active-friends: true
    period-top: false

# ── Discord ─────────────────────────────────────────────
# Messages in a Discord channel. Discord: channel settings > Integrations > Webhooks > New webhook > Copy URL.
# Keep the URL secret (anyone with it can write in the channel). Mentions (@everyone, roles) are never sent.
# A message with "" is not sent. Discord markdown works: **bold**, *italic*
discord:
  enabled: false
  url: ""
  username: "Referrals"
  # A colored box (embed) or plain text
  embed: true
  color: "#FF7A6B"
  messages:
    # {player} = new player, {inviter}, {invites} = invites of the inviter now
    referral: "**{inviter}** invited **{player}** to the server! ({invites} invites)"
    # {player} = the inviter, {milestone}, {invites}
    milestone: "**{player}** reached **{milestone} invites**!"
    # When a week / month ends (needs period-top.enabled). {period-name} {period} {winners}
    period-top: "**{period-name} TOP** is over: {winners}"

# ── Weekly and monthly top ──────────────────────────────
# /referrals top weekly and /referrals top monthly show the invites of this week / month (always on).
# With enabled: true the best inviters get the rewards of rewards.yml > period-top when the week / month ends,
# and the winners are announced. An invite counts in the week in which it was written. Off by default.
# Placeholders: %flarereferrals_weekly_invites% _weekly_position _weekly_time %flarereferrals_top_weekly_<n>_name%
# (_invites, _line), the same with monthly
period-top:
  enabled: false
  weekly-rewards: true
  monthly-rewards: true
  # Message to everyone with the first players when a week / month ends (texts in lang/en.yml > period)
  announce: true
  announce-lines: 3
  # MONDAY ... SUNDAY
  week-starts: MONDAY
  # "" = the time zone of the server. Examples: Europe/Rome, Europe/London, America/New_York, UTC
  timezone: ""

milestones:
  # Give milestone rewards (every 3 / 5 / 10 ... invites)
  enabled: true

rewards:
  # true = rewards wait in /referrals collect until the player takes them (with a notification)
  # false = given right away. Each reward can change it in rewards.yml (delivery: menu / auto)
  collect-menu: true
  # How players are told that something is waiting (texts in lang/en.yml > collect)
  notify:
    chat: true
    title: false
    actionbar: true
    sound: true
  # Reminder every X minutes while something waits. 0 = off
  remind-minutes: 10
  # When the player is offline, keep the reward and give it on next join
  offline-queue: true
  # Drop items on the ground when the inventory is full (false = items that don't fit are lost)
  drop-if-full: true

sounds:
  enabled: true
  click: "ui.button.click"
  success: "entity.player.levelup"
  reward: "entity.experience_orb.pickup"
  error: "entity.villager.no"

input:
  # Word to type in chat to cancel a menu prompt
  cancel-word: "cancel"
  # Seconds before a chat prompt expires
  timeout-seconds: 60

# ── Who invited you? ────────────────────────────────────
# Asks new players who invited them until they write /referrals <name>, or until they can't anymore
# (referral.max-days-after-first-join). Admins never get it. Off by default. Texts in lang/en.yml > hint.
# In a menu: add the "Who invited you" button to /referrals menu in its editor (Menu layouts > main).
# Anywhere else (scoreboard, hologram, tab): %flarereferrals_referred% and %flarereferrals_can_enter%
invite-hint:
  enabled: false
  # Only players who joined the server for the first time in the last X days. 0 = every player without an inviter
  only-new-days: 7
  # true = only on their very first join
  only-first-join: false
  # First reminder this many seconds after joining
  delay-seconds: 15
  # Again every X minutes while they are online. 0 = once per join
  repeat-minutes: 10
  # At most X reminders per join. 0 = no limit
  max-per-join: 3
  # With referral.min-playtime-minutes: the reminders start only once they played enough
  wait-for-playtime: true
  # Where it is shown (any combination)
  show:
    chat: true
    title: false
    actionbar: false
    bossbar: false
    # "" = no sound
    sound: "block.note_block.pling"
  # Ticks (20 = 1 second)
  title:
    fade-in: 10
    stay: 70
    fade-out: 20
  # color: PINK BLUE RED GREEN YELLOW PURPLE WHITE   style: PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20
  bossbar:
    color: PINK
    style: PROGRESS
    seconds: 10

# ── Reward events ───────────────────────────────────────
# /referrals event start <multiplier> <time> [reason]   e.g. /referrals event start 2 48h Weekend!
# Rewards earned with an invite during the event are multiplied (they keep it also when collected later).
# Off by default: with enabled: false nobody can start one. On a network the event runs on every server.
# Texts in lang/en.yml > event. Placeholders: %flarereferrals_event_active% _multiplier _time _reason
events:
  enabled: false
  # Highest multiplier an admin can use
  max-multiplier: 10
  multiply:
    # Money, tokens, mobcoins, XP levels... every currency of the reward
    currencies: true
    # Items too (only whole multipliers: x2, x3. With x1.5 the items stay the same)
    items: false
  # Which rewards get the bonus
  rewards:
    inviter: true
    welcome: true
    milestones: true
  # How everyone is told
  show:
    # message when it starts and when it ends
    chat: true
    # title when it starts
    title: true
    # boss bar with the time left, for the whole event
    bossbar: true
    # action bar with the time left
    actionbar: false
    # message to players who join during the event
    join-message: true
    # sound when it starts ("" = none)
    sound: "entity.player.levelup"
  # color: PINK BLUE RED GREEN YELLOW PURPLE WHITE   style: PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20
  bossbar:
    color: YELLOW
    style: PROGRESS
  title:
    fade-in: 10
    stay: 70
    fade-out: 20
  # Chat reminder every X minutes while it runs. 0 = off
  remind-minutes: 0

# ── PlaceholderAPI ──────────────────────────────────────
# Texts of the %flarereferrals_...% placeholders (full list: Placeholders page of the wiki)
placeholders:
  # %flarereferrals_top_<n>_line%   {position} {player} {invites}, also placeholders of that player (%luckperms_prefix%)
  top-line: "&#ff7a6b#{position} &f{player} &7- &#ff7a6b{invites}"
  # top_<n>_name and position when there is nobody
  nobody: "-"
  # referred, can_enter, event_active
  true-text: "Yes"
  false-text: "No"

# Currencies usable as rewards. Add as many as you want.
# mobcoins / tokens / coins are examples: turn them on (enabled: true) only if their plugin is installed.
# When a currency can't work (plugin missing), the console says why once and the rewards with it are skipped.
# type:
#   VAULT      -> economy through Vault (EssentialsX, CMI, ...)
#   COMMAND    -> runs a console command, use {player} {uuid} {amount}  (MobCoins, Tokens, PlayerPoints, private coins...)
#   EXP        -> experience points
#   EXP_LEVELS -> experience levels
# display: how the reward is shown in menus and messages ({amount} = amount)
currencies:
  money:
    enabled: true
    type: VAULT
    name: "&aMoney"
    display: "&a${amount}"
    icon: GOLD_INGOT
  mobcoins:
    enabled: false
    type: COMMAND
    command: "mobcoins give {player} {amount}"
    name: "&6MobCoins"
    display: "&6{amount} MobCoins"
    icon: SUNFLOWER
  tokens:
    enabled: false
    type: COMMAND
    command: "tokens give {player} {amount}"
    name: "&bTokens"
    display: "&b{amount} Tokens"
    icon: PRISMARINE_CRYSTALS
  playerpoints:
    enabled: false
    type: COMMAND
    command: "points give {player} {amount}"
    name: "&dPoints"
    display: "&d{amount} Points"
    icon: AMETHYST_SHARD
  coins:
    enabled: false
    type: COMMAND
    command: "coins give {player} {amount}"
    name: "&eServer Coins"
    display: "&e{amount} Coins"
    icon: RAW_GOLD
  exp:
    enabled: true
    type: EXP_LEVELS
    name: "&2XP Levels"
    display: "&2{amount} XP levels"
    icon: EXPERIENCE_BOTTLE

# ── Storage ─────────────────────────────────────────────
# Where the data is saved. Leave yaml if you have one server.
#   yaml    plugins/FlareReferrals/data.yml (default)
#   sqlite  plugins/FlareReferrals/data/data.db (one server, many players)
#   mysql   MySQL / MariaDB database, needed to share referrals between servers (network below)
# To change it with your data: /referrals migrate <yaml|sqlite|mysql>, it copies everything and sets this for you.
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: flarereferrals
    username: root
    password: ""
    # Extra connection settings, change only if your host asks for it
    properties: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"
    # Change it only to keep two separate data sets in the same database
    table-prefix: "fr_"

# ── Network ─────────────────────────────────────────────
# Lobby, Skyblock, Survival... behind BungeeCord / Velocity sharing the same invites.
# Install FlareReferrals on every server (lobby too), all with the same storage.mysql settings.
network:
  enabled: false
  # A different name on every server: lobby, skyblock, survival... (used by "servers" in rewards.yml)
  server-name: ""
  # false = this server only saves invites and gives no rewards (e.g. the lobby)
  rewards-here: true
  # How often servers look for changes made by the others (seconds)
  sync-seconds: 3
