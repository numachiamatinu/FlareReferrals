#  Flare Referrals · texts of the admin menus (/referrals settings and the layout editor)
#  Player menu texts are in main.yml / rewards.yml / top.yml / preview.yml (section "texts")
#  Chat messages are in lang/en.yml   ·   after editing: /referrals reload
#  Placeholders {name} {amount} ... are filled by the plugin, keep them.
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Tip       always write texts between "quotes"

common:
  enabled: "&aEnabled"
  disabled: "&cDisabled"
  none: "&7none"
  back:
    name: "&c← Back"
    lore: []
  close:
    name: "&cClose"
    lore: []
names:
  inviter: "&eInviter reward"
  invited: "&aInvited reward"
settings:
  title: "<gradient:#ff5f6d:#ffc371>Flare Referrals</gradient> &7- Settings"
  toggle-lore:
  - ""
  - "&7Status: {status}"
  - "&eClick to toggle"
  options:
    referral-enabled:
      name: "&fReferral command"
      lore:
      - "&7New players write &f/referrals <player>"
      - "&7with the name of who invited them."
    same-ip:
      name: "&fBlock same IP"
      lore:
      - "&7A player can't enter someone who"
      - "&7plays from the same network (alts)."
    circular:
      name: "&fBlock circular referrals"
      lore:
      - "&7If B entered A as inviter,"
      - "&7A can't enter B back."
    broadcast:
      name: "&fBroadcast referrals"
      lore:
      - "&7Announce every referral to the server."
    milestones-enabled:
      name: "&fMilestones"
      lore:
      - "&7Give rewards every 3 / 5 / 10... invites."
    offline-queue:
      name: "&fOffline rewards"
      lore:
      - "&7Keep rewards for offline players"
      - "&7and give them when they join."
    drop-if-full:
      name: "&fDrop when inventory full"
      lore:
      - "&7Drop items on the ground if"
      - "&7the inventory is full."
    claim-in-menu:
      name: "&fCollect milestones"
      lore:
      - "&7On: players collect reached milestones"
      - "&7by clicking them in the menu."
      - "&7Off: given automatically."
    sounds:
      name: "&fSounds"
      lore:
      - "&7Menu and reward sounds."
  playtime:
    name: "&fMinimum playtime"
    lore:
    - "&7Playtime a player needs before"
    - "&7entering who invited them."
    - ""
    - "&7Current: &e{value} minutes"
    - ""
    - "&eLeft-click &7+5  &eRight-click &7-5"
    - "&eShift-click &7type a value"
  referral-rewards:
    name: "&eReferral rewards"
    lore:
    - "&7Inviter reward and welcome reward,"
    - "&7separate from milestones."
    - ""
    - "&7Inviter: {inviter}"
    - "&7Invited: {invited}"
    - "&eClick to open"
  inviter-rewards:
    name: "&eInviter rewards"
    lore:
    - "&7What the &finviter &7gets every time"
    - "&7a new player enters his name."
    - ""
    - "&7Status: {status}"
    - "&eClick to edit"
  invited-rewards:
    name: "&aInvited rewards"
    lore:
    - "&7What the new player gets when"
    - "&7he enters who invited him."
    - ""
    - "&7Status: {status}"
    - "&eClick to edit"
  milestones:
    name: "&6Milestones"
    lore:
    - "&7Rewards at 3 / 5 / 10... invites."
    - "&7Items, money, MobCoins, tokens,"
    - "&7custom coins, commands..."
    - ""
    - "&7Milestones: &f{amount}"
    - "&eClick to edit"
  currencies:
    name: "&6Currencies"
    lore:
    - "&7Loaded currencies: &f{amount}"
    - ""
    - "&7Add new ones (MobCoins, tokens,"
    - "&7private coins...) in &fconfig.yml"
    - "&7under &fcurrencies&7, then reload."
  messages:
    name: "&fMessages"
    lore:
    - "&7Chat messages: &flang/en.yml"
    - "&7Menu texts: &fmenus/&7 (each menu file,"
    - "&7admin menus in &fadmin.yml&7)"
    - ""
    - "&7Reward messages can be edited"
    - "&7directly in each reward menu."
  top:
    name: "&bTop inviters"
    lore:
    - "&eClick to open"
  player-access:
    name: "&aPlayer access"
    lore:
    - "&7Choose what normal players"
    - "&7(without admin) can open."
    - ""
    - "&eClick to open"
  layouts:
    name: "&dMenu layouts"
    lore:
    - "&7Move buttons, glass and heads of"
    - "&7the player menus with drag & drop."
    - "&7Also editable in &fmenus/*.yml&7."
    - ""
    - "&eClick to open"
  reload:
    name: "&aReload"
    lore:
    - "&7Reload config, rewards and messages."
