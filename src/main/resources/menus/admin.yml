layout:
  list-title: "<gradient:#ff5f6d:#ffc371>Menu layouts</gradient>"
  editor-title: "&7Editing » &f{menu} &7(close = save)"
  palette-title: "&7Add to slot {slot}"
  default-title: "&7default"
  confirm-reset: "&7Restore the default layout of &f{menu}&7?"
  menus:
    main:
      name: "&fMain menu"
      description: "&7/referrals menu"
    rewards:
      name: "&fReferral rewards"
      description: "&7/referrals rewards"
    top:
      name: "&fTop inviters"
      description: "&7Top menu"
    preview:
      name: "&fReward preview"
      description: "&7What a reward gives"
  menu-entry:
  - "{description}"
  - ""
  - "&7Size: &e{rows} rows &7({slots} slots)"
  - "&7Title: {title}"
  - "&7Open commands: &f{commands}"
  - "&7File: &f{file}"
  - ""
  - "&eLeft-click &7edit with drag & drop"
  - "&eRight-click &7+1 row (1-6)"
  - "&eShift-left &7change title"
  - "&eShift-right &7restore default"
  help:
    name: "&eHow it works"
    lore:
    - "&7Open a menu in edit mode and move"
    - "&7everything like in a chest."
    - "&7Your own items (glass, custom heads"
    - "&7from minecraft-heads.com...) become"
    - "&7decorations. Closing saves."
    - ""
    - "&7Click actions for decorations can be"
    - "&7added in &fmenus/<menu>.yml&7."
  admin-only-tag:
  - ""
  - "&c[Admin only] &7players don't see it"
  - "&7Shift + right-click to change"
  toggle:
    name: "{status}"
    lore:
    - "&7Turn the &f{menu} &7menu on or off"
    - "&7for everyone. Off: its commands and"
    - "&7the buttons that open it disappear."
    - ""
    - "&eClick to switch"
  list-slot:
    name: "{element} &7» &fslot {number}"
    lore:
    - "&7The entries of this list (milestones,"
    - "&7players, rewards...) fill these slots"
    - "&7in order, number 1 first."
    - ""
    - "&7Move it to move the slot."
    - "&7Take it out to remove the slot."
  palette-element:
  - "&7Slots used now: &e{amount}"
  - ""
  - "&eClick &7to put it here"
  palette-glass:
    name: "&fDecoration"
    lore:
    - "&eClick &7to put it here"
  palette-help:
    name: "&eAdd to this slot"
    lore:
    - "&7Pick a button of the menu or a glass."
    - "&7Any other item: drag it from your"
    - "&7inventory into the menu."
  elements:
    head: "&fYour stats (head)"
    milestones: "&6Milestones list"
    referral-rewards: "&eReferral rewards button"
    top: "&bTop button"
    settings: "&cAdmin settings button"
    close: "&cClose button"
    info: "&fInfo book"
    inviter: "&eInviter reward"
    invited: "&aWelcome reward"
    back: "&cBack button"
    entries: "&fTop players list"
    items: "&fRewards list"
    edit: "&eEdit button (admins)"
