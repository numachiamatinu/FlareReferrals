    actionbar-label: "&7Action bar:"
    bossbar-label: "&7Boss bar:"
  preview:
    name: "&bPreview"
    lore:
    - "&7See what players get."
  delete:
    name: "&cDelete"
    lore:
    - "&7Deletes the {amount} invites milestone."
access:
  title: "&7Player access"
  toggle-lore:
  - ""
  - "&7Normal players: {status}"
  - "&7Admins can always open it."
  - "&eClick to toggle"
  options:
    info:
      name: "&f/referrals info"
      lore:
      - "&7Invites, inviter and the"
