#  Flare Referrals · menu 'main' (/referrals menu)
#  In-game: /referrals settings > Menu layouts   (drag & drop · close = save)
#  Chest:   /referrals layout chest <menu> puts it in a chest, /referrals layout import <menu> reads it back
#
#  enabled         false = menu off for everyone
#  rows            size of the menu: 1-6 rows (9-54 slots)
#  open-commands   [rewards] → /rewards opens it   ·   open-permission: "" = everyone
#  slots           "4"  "19-25"  "0-8,45-53"   (row 1 = 0-8, row 2 = 9-17 ...)
#  material        DIAMOND · head:{player} · head:Notch · texture:<minecraft-heads value>
#  admin-only      true = players don't see it
#  permission      "node" = only players with it see the item ("" = everyone)
#  update          true = drawn again every second (live placeholders)
#  actions         [close] [open] <menu> [back] [refresh] [player] cmd [console] cmd [chat] text
#                  [message] text [broadcast] text [actionbar] text [title] title;subtitle;in;stay;out
#                  [sound] key [volume] [pitch] [delay] ticks [server] name
#                  [left] / [right] / [shift-left] / [shift-right] in front = only that click
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Click     "<click:run_command:'/referrals menu'>Text</click>"   Hover "<hover:show_text:'Text'>Text</hover>"
#  Tip       always write texts between "quotes"

enabled: true
open-commands: []
open-permission: ""
title: "<gradient:#ff5f6d:#ffc371>Your rewards</gradient>"
rows: 6
elements:
  head:
    # placeholders: {player} {invites} {referrer} {next}
    slots: "4"
    admin-only: false
    material: "head:{player}"
    name: "&f{player}"
    lore:
      - "&7Invites: &#ff7a6b{invites}"
      - "&7Invited by: &f{referrer}"
      - "&7Next milestone: &f{next}"
  milestones:
    # list: one slot per milestone (icons and texts come from the milestones)
    slots: "19-25,28-34,37-43"
    admin-only: false
  referral-rewards:
    slots: "47"
    admin-only: false
    material: "EMERALD"
    name: "&#ff7a6bReferral rewards"
    lore:
      - "&7What you get for inviting players"
      - "&7and what new players get."
      - ""
      - "&#ff7a6bClick to open"
  close:
    slots: "49"
    admin-only: false
    material: "ARROW"
    name: "&cClose"
    lore: []
  top:
    slots: "51"
    admin-only: false
    material: "KNOWLEDGE_BOOK"
    name: "&#ff7a6bTop inviters"
    lore:
      - "&#ff7a6bClick to open"
  collect:
    # rewards waiting to be collected. placeholder: {amount}
    slots: "45"
    admin-only: false
    material: "CHEST_MINECART"
    name: "&aRewards to collect"
    lore:
      - "&7Waiting: &#ff7a6b{amount}"
      - ""
      - "&#ff7a6bClick to open"
  settings:
    # only admins see it
    slots: "53"
    admin-only: true
    material: "COMPARATOR"
    name: "&cAdmin settings"
    lore:
      - "&7Open /referrals settings"
decorations:
  - slots: "0-3,5-8,9,17,18,26,27,35,36,44,46,48,50,52"
    material: "RED_STAINED_GLASS_PANE"
    name: " "
    lore: []
    glow: false
    admin-only: false
    actions: []

# ── Texts of this menu ──
# milestone.* = lines added to each milestone (ready / locked / claimed ...)
# elsewhere = ready, but it can be collected only on another server of the network
# next-invite = reached, but not received yet (after admin set / resetclaimed): it comes with the next invite
texts:
  milestone:
    ready:
    - "&#ff7a6b★ Ready to collect!"
    claim-click:
    - ""
    - "&#ff7a6bClick to collect"
    claimed:
    - "&a✔ Claimed"
    elsewhere:
    - "&7Collect it on &f{servers}"
    next-invite:
    - "&#ff7a6b◷ &7Reached: given at the next invite"
    locked:
    - "&7Progress: &#ff7a6b{invites}&7/&#ff7a6b{target}"
    - "&7Missing: &f{remaining}"
    repeat:
    - "&#ff7a6b⟳ Every {amount} invites"
    - "&7Next at &#ff7a6b{target} &7({remaining} left)"
    click:
    - ""
    - "&#ff7a6bClick &7to see the rewards"
    admin:
    - "&cShift-click &7to edit"
  no-milestones:
    name: "&cNo milestones"
    lore: []
  # buttons not in the menu by default: add them in the editor (/referrals layout main > empty slot)
  # who-invited: open = he can write it now, wait = playtime first ({minutes}), done = {referrer}, closed = time over
  who-invited:
    open:
      name: "&#ff7a6bWho invited you?"
      lore:
      - "&7Write the name of the player"
      - "&7who invited you: you both"
      - "&7get a reward."
      - ""
      - "&#ff7a6bClick to write it"
    wait:
      name: "&#ff7a6bWho invited you?"
      lore:
      - "&7Play &f{minutes} more minutes"
      - "&7to enter who invited you."
    done:
      name: "&aInvited by &f{referrer}"
      lore:
      - "&7Thanks for joining!"
    closed:
      name: "&7Who invited you?"
      lore:
      - "&7The time to enter it is over."
  # needs player-access.invited: true in config.yml. {amount}
  invited-list:
    name: "&#ff7a6bYour invited players"
    lore:
    - "&7Invited: &#ff7a6b{amount}"
    - ""
    - "&#ff7a6bClick to open"
