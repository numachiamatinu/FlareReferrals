#  Flare Referrals · menu 'main' (/referrals menu)
#  In-game: /referrals settings > Menu layouts   (drag & drop · close = save)
#
#  enabled         false = menu off for everyone
#  rows            size of the menu: 1-6 rows (9-54 slots)
#  open-commands   [rewards] → /rewards opens it   ·   open-permission: "" = everyone
#  slots           "4"  "19-25"  "0-8,45-53"   (row 1 = 0-8, row 2 = 9-17 ...)
#  material        DIAMOND · head:{player} · head:Notch · texture:<minecraft-heads value>
#  admin-only      true = players don't see it
#  actions         [close] [open] top [player] cmd [console] cmd [message] text [sound] key
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#ff5f6dText"
#  Gradient  "<gradient:#ff5f6d:#ffc371>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Click     "<click:run_command:'/referrals menu'>Text</click>"   Hover "<hover:show_text:'Text'>Text</hover>"
#  Tip       always write texts between "quotes"

enabled: true
open-commands: []
open-permission: ""
title: "<gradient:#ff5f6d:#ffc371>Your rewards</gradient>"
rows: 6
elements:
  head:
    # placeholders: {player} {invites} {referrer} {next}
    slots: "4"
    admin-only: false
    material: "head:{player}"
    name: "&f{player}"
    lore:
      - "&7Invites: &e{invites}"
      - "&7Invited by: &f{referrer}"
      - "&7Next milestone: &f{next}"
  milestones:
    # list: one slot per milestone (icons and texts come from the milestones)
    slots: "19-25,28-34,37-43"
    admin-only: false
  referral-rewards:
    slots: "47"
    admin-only: false
    material: "EMERALD"
    name: "&eReferral rewards"
    lore:
      - "&7What you get for inviting players"
      - "&7and what new players get."
      - ""
      - "&eClick to open"
  close:
    slots: "49"
    admin-only: false
    material: "ARROW"
    name: "&cClose"
    lore: []
  top:
    slots: "51"
    admin-only: false
    material: "KNOWLEDGE_BOOK"
    name: "&bTop inviters"
    lore:
      - "&eClick to open"
  settings:
    # only admins see it
    slots: "53"
    admin-only: true
    material: "COMPARATOR"
    name: "&cAdmin settings"
    lore:
      - "&7Open /referrals settings"
decorations:
  - slots: "0-3,5-8,9,17,18,26,27,35,36,44,45,46,48,50,52"
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
    lore: []
    glow: false
    admin-only: false
    actions: []

# ── Texts of this menu ──
# milestone.* = lines added to each milestone (ready / locked / claimed ...)
texts:
  milestone:
    ready:
    - "&e★ Ready to collect!"
    claim-click:
    - ""
    - "&eClick to collect"
    claimed:
    - "&a✔ Claimed"
    locked:
    - "&7Progress: &e{invites}&7/&e{target}"
    - "&7Missing: &f{remaining}"
    repeat:
    - "&e⟳ Every {amount} invites"
    - "&7Next at &e{target} &7({remaining} left)"
    click:
    - ""
    - "&eClick &7to see the rewards"
    admin:
    - "&cShift-click &7to edit"
  no-milestones:
    name: "&cNo milestones"
    lore: []
